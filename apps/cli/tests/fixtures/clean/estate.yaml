# clean — a small, fully VALID estate. Loads ok:true with zero error findings.
# One managed-linux host renders a real scrape target and reports as covered.
estate:
  schema_version: 1
  name: clean-estate
  domains:
    - example.com
  timezone: UTC
  deadman_hook: https://example.com/deadman

hosts:
  - name: web-01
    collection_class: managed-linux
    delivery_form: compose
    addresses:
      - 10.0.0.11
    exporter_ports:
      - 9100
