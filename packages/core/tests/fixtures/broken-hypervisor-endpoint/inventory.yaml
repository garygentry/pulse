# broken-hypervisor-endpoint — shape-CLEAN but semantically broken: a hypervisor-api host's
# api_endpoint carries userinfo, a shape the hypervisor scrape (scrape.yml §1c) cannot reduce to
# the bare host pve-exporter needs as ?target=, so the host would scrape as down for good
# (issue #74). The semantic layer emits exactly one INVALID_HYPERVISOR_ENDPOINT. This is the
# covering case for that code in meta.test.ts's anti-rot guard (07 §4).
estate:
  schema_version: 1
  name: hv-broken
  domains:
    - hv.example
  timezone: America/Chicago
  deadman_hook: "${DEADMAN}"

hosts:
  - name: pve-bad
    collection_class: hypervisor-api
    addresses:
      - 10.0.0.5
    api_endpoint: https://user:pw@pve-bad.hv.example:8006 # INVALID_HYPERVISOR_ENDPOINT
    credential: "${PVE_TOKEN}"
