groups:
  - interval: 30s
    name: synthetic-checks
    rules:
      - alert: GatusCheckFailed
        annotations:
          description: Portal ingress synthetic check failing
          runbook_url: https://runbooks.pulse.local/synthetic
          summary: Gatus check host-alpha/portal is failing
          url: https://portal.fixture.invalid/
        expr: (((sum by (name, group) (increase(gatus_results_total{name="host-alpha/portal",group="host-alpha",success="false"}[3m])) >= 3) unless on (name, group) (sum by (name, group) (increase(gatus_results_total{name="host-alpha/portal",group="host-alpha",success="true"}[3m])) > 0)) or on (name, group) ((sum by (name, group) (increase(gatus_results_total{name="host-alpha/portal",group="host-alpha",success="false"}[210s])) >= 3) unless on (name, group) (sum by (name, group) (increase(gatus_results_total{name="host-alpha/portal",group="host-alpha",success="true"}[210s])) > 0)) or on (name, group) ((sum by (name, group) (increase(gatus_results_total{name="host-alpha/portal",group="host-alpha",success="false"}[12m])) >= 3) unless on (name, group) (sum by (name, group) (increase(gatus_results_total{name="host-alpha/portal",group="host-alpha",success="true"}[12m])) > 0))) or on (name, group) (max by (name, group) (ALERTS{alertname="GatusCheckFailed",alertstate="firing",name="host-alpha/portal",group="host-alpha"}) unless on (name, group) ((sum by (name, group) (increase(gatus_results_total{name="host-alpha/portal",group="host-alpha",success="true"}[4m])) >= 2) unless on (name, group) (sum by (name, group) (increase(gatus_results_total{name="host-alpha/portal",group="host-alpha",success="false"}[4m])) > 0)))
        labels:
          endpoint: host-alpha/portal
          group: host-alpha
          severity: critical
          source: gatus
