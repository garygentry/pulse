# stack/gatus/alerting-provider.yaml  →  mounted at /config/00-alerting.yaml
#
# Estate-agnostic, stack-owned Gatus config: the top-level `metrics` toggle only. Gatus merges this
# with the rendered /config/10-endpoints.yaml (§4.1). The filename is historical; it is kept so the
# compose mount and the docs that name it stay stable.
#
# NO ALERTING HERE (issue #1). Gatus checks page through vmalert, not a Gatus alerting provider:
# stack/alerting renders one `GatusCheckFailed` rule per service with an enabled `alerts:` binding
# (rendered/vmalert/rules/synthetic.yml) over the `gatus_results_total` series Gatus exposes below,
# and vmalert hands it to Alertmanager — the estate's ONE routing/silence/deadman brain. The former
# Gatus→Alertmanager `custom` push provider was retired because, on the pinned Gatus v5.13.1 and
# Alertmanager v0.27.0, it could not express an alert lifecycle:
#   - it never set `endsAt`, so the "resolved" POST re-fired the alert, which then lingered until
#     Alertmanager's `resolve_timeout`;
#   - Gatus sends TRIGGERED once and never re-sends while failing, so any outage longer than
#     `resolve_timeout` auto-resolved in Alertmanager with a false "resolved" notification.
# vmalert re-sends a firing alert every evaluation and sends a real resolve, so neither applies.

# Expose the Prometheus `/metrics` endpoint on :8080 (issue #31). Gatus serves /metrics ONLY when
# this top-level toggle is set; without it, /metrics 404s, the `gatus` scrape job's `up` series is
# permanently 0, and the `AncillaryDown{job="gatus"}` rule (in stack/compose/config/vmalert/rules/) is a
# permanent false positive on a healthy gatus. It also surfaces the per-endpoint `gatus_results_*`
# series the synthetic-check rules (issue #1) and dashboards read. Estate-agnostic (04 §4).
metrics: true
